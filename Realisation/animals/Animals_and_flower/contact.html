        <div class="search-wrapper" id="conteneur_recherche">
            <input type="text" class="search-field" placeholder="Rechercher..." id="bouton_entree">

            </a>

        <a href="compte.html" class="icone_compte"><img src="images/logo_compte.png"
                alt="Logo servant à aller sur la page de connexions à un compte"></a>




    </header>

    <main class="contenu-contact">
        <h1>Contactez-nous</h1>

        <form action="#" method="POST" class="formulaire-contact">

            <div class="groupe-champ">
                <label for="sujet">Sujet du message</label>
                <input type="text" id="sujet" name="sujet" placeholder="Ex: Question sur une commande..." required>
            </div>

            <div class="ligne-champs">
                <div class="groupe-champ">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
                </div>
                <div class="groupe-champ">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
                </div>
            </div>

            <div class="groupe-champ">
                <label for="email">Adresse Email</label>
                <input type="email" id="email" name="email" placeholder="exemple@domaine.com" required>
            </div>

            <div class="groupe-champ">
                <label for="message">Votre message</label>
                <textarea id="message" name="message" rows="6" placeholder="Écrivez votre message ici..."
                    required></textarea>
            </div>

            <div class="validation-formulaire">
                <button type="submit" class="bouton-envoyer">Envoyer le message</button>
            </div>

        </form>
    </main>
